<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>مصاريفي — ميزانيتك بوضوح</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#111827;--mut:#6b7280;--pri:#4f46e5;--ok:#059669;--bad:#dc2626;--line:#e5e7eb}
*{box-sizing:border-box;margin:0;font-family:Tahoma,"Segoe UI",sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh}
.hide{display:none!important}
input,select,button{font-size:15px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);outline:none;width:100%}
input:focus,select:focus{border-color:var(--pri)}
button{background:var(--pri);color:#fff;border:0;cursor:pointer;font-weight:700}
button.sec{background:#eef0ff;color:var(--pri)}
#auth{min-height:100vh;display:grid;place-items:center;background:#111827;padding:16px}
.box{background:var(--card);padding:32px;border-radius:20px;width:100%;max-width:380px;display:grid;gap:12px}
.logo{font-size:30px;font-weight:800;text-align:center}.sub{text-align:center;color:var(--mut);margin-bottom:6px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tabs button{background:#f3f4f6;color:var(--mut)}.tabs button.on{background:var(--pri);color:#fff}
.err{color:var(--bad);font-size:14px;min-height:18px;text-align:center}
header{background:#111827;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:20px}header span{color:#9ca3af;font-size:14px;margin-inline-end:12px}header button{width:auto;background:#374151;padding:8px 14px}
main{max-width:980px;margin:0 auto;padding:20px;display:grid;gap:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.c{background:var(--card);padding:18px;border-radius:16px;box-shadow:0 1px 3px #0001}
.c small{color:var(--mut)}.c h3{font-size:24px;margin-top:6px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:5px 0 12px}.bar i{display:block;height:100%;background:var(--pri)}
table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:11px 8px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mut)}
.x{background:none;color:var(--bad);width:auto;padding:2px 8px}
.in{color:var(--ok);font-weight:700}.out{color:var(--bad);font-weight:700}
</style></head><body>
<section id="auth"><div class="box">
<div class="logo">مصاريفي ◈</div><div class="sub">ميزانيتك بوضوح — بدون أي معلومات شخصية</div>
<div class="tabs"><button id="tL" class="on" onclick="mode('login')">دخول</button><button id="tS" onclick="mode('signup')">حساب جديد</button></div>
<input id="u" placeholder="اسم المستخدم (إنجليزي)" autocomplete="username">
<input id="p" type="password" placeholder="كلمة السر" autocomplete="current-password">
<div class="err" id="err"></div><button id="go" onclick="auth()">دخول</button>
</div></section>

<section id="app" class="hide">
<header><b>مصاريفي</b><div><span id="who"></span><button onclick="logout()">خروج</button></div></header>
<main>
<div class="cards">
<div class="c"><small>الرصيد الحالي</small><h3 id="bal">٠</h3></div>
<div class="c"><small>دخل هذا الشهر</small><h3 class="in" id="inc">٠</h3></div>
<div class="c"><small>مصروفات هذا الشهر</small><h3 class="out" id="exp">٠</h3></div>
</div>
<div class="c"><b>＋ معاملة جديدة</b><br><br>
<form class="form" onsubmit="event.preventDefault();add()">
<select id="ty" onchange="cats()"><option value="expense">مصروف</option><option value="income">دخل</option></select>
<input id="am" type="number" min="1" step="any" placeholder="المبلغ (د.ع)" required>
<select id="ca"></select><input id="no" placeholder="ملاحظة">
<input id="da" type="date"><button>إضافة</button></form></div>
<div class="c"><b>الإنفاق حسب الفئة (هذا الشهر)</b><br><br><div id="cb"></div></div>
<div class="c" style="overflow-x:auto"><b>المعاملات</b>
<table><thead><tr><th>التاريخ</th><th>الفئة</th><th>الوصف</th><th>المبلغ</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</main></section>

<script>
const E=["طعام","مواصلات","تسوق","فواتير","صحة","ترفيه","أخرى"],I=["راتب","أرباح","أخرى"];
let M="login",T=localStorage.t,L=[];
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";"),f=n=>Number(n).toLocaleString("ar-IQ")+" د.ع";
function mode(m){M=m;$("tL").className=m=="login"?"on":"";$("tS").className=m=="signup"?"on":"";$("go").textContent=m=="login"?"دخول":"إنشاء الحساب";$("err").textContent=""}
async function api(p,o={}){const r=await fetch("/api/"+p,{...o,headers:{"content-type":"application/json",authorization:"Bearer "+T}});const d=await r.json();if(r.status==401&&T&&!p.match(/login|signup/)){logout();}if(!r.ok)throw d.error||"خطأ";return d}
async function auth(){try{const d=await api(M,{method:"POST",body:JSON.stringify({username:$("u").value,password:$("p").value})});T=d.token;localStorage.t=T;localStorage.n=d.username;start()}catch(e){$("err").textContent=e}}
function logout(){localStorage.clear();T=null;$("app").classList.add("hide");$("auth").classList.remove("hide")}
function cats(){$("ca").innerHTML=($("ty").value=="expense"?E:I).map(c=>`<option>${c}</option>`).join("")}
async function start(){$("auth").classList.add("hide");$("app").classList.remove("hide");$("who").textContent="👤 "+localStorage.n;$("da").value=new Date().toISOString().slice(0,10);cats();try{L=await api("tx");draw()}catch(e){}}
async function add(){try{await api("tx",{method:"POST",body:JSON.stringify({type:$("ty").value,amount:$("am").value,category:$("ca").value,note:$("no").value,date:$("da").value})});$("am").value=$("no").value="";L=await api("tx");draw()}catch(e){alert(e)}}
async function del(id){if(!confirm("حذف المعاملة؟"))return;await api("tx/"+id,{method:"DELETE"});L=L.filter(x=>x.id!=id);draw()}
function draw(){const m=new Date().toISOString().slice(0,7),mo=L.filter(x=>x.date.startsWith(m)),s=(a,t)=>a.filter(x=>x.type==t).reduce((p,x)=>p+x.amount,0),ex=s(mo,"expense");
$("bal").textContent=f(s(L,"income")-s(L,"expense"));$("inc").textContent=f(s(mo,"income"));$("exp").textContent=f(ex);
const g={};mo.filter(x=>x.type=="expense").forEach(x=>g[x.category]=(g[x.category]||0)+x.amount);
$("cb").innerHTML=Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><span>${f(v)}</span></div><div class="bar"><i style="width:${v/ex*100}%"></i></div>`).join("")||"<small>ماكو مصروفات هذا الشهر</small>";
$("tb").innerHTML=L.slice(0,100).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.note)}</td><td class="${x.type=="income"?"in":"out"}">${x.type=="income"?"+":"−"}${f(x.amount)}</td><td><button class="x" onclick="del('${x.id}')">✕</button></td></tr>`).join("")}
if(T)start();
</script></body></html>
